name: Actualización Total NetVideo (Pelis + Series)

on:
  schedule:
    # Ejecutar cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # PERMISO DE ESCRITURA (CRUCIAL)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: pip install requests

      # --- 1. GENERAR TODAS LAS LISTAS ---
      - name: Generar Peliculas (M3U)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }}
        run: python netvideo.py

      - name: Generar Series (M3U)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }} 
        run: python netvideo_series.py
        
      - name: Generar Peliculas (JSON)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }} 
        run: python netvideo_json.py

      - name: Generar Series (JSON)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }} 
        run: python netvideo_series_json.py
        
      # --- 2. SUBIR TODO AL GIST EN UN SOLO MOVIMIENTO ---
      - name: Subir a Gist (Python Directo)
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GIST }}
          GIST_ID_PELIS: ${{ secrets.GIST_ID_PELIS }}
        run: python subir_netvideo.py