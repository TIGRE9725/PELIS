name: Actualización Total NetVideo (Pelis + Series)

on:
  schedule:
    # Ejecutar cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # PERMISO DE ESCRITURA (CRUCIAL)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: pip install requests

      # --- 1. GENERAR TODAS LAS LISTAS ---
      - name: Generar Peliculas (M3U)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }}
        run: python netvideo.py

      - name: Generar Series (M3U)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }} 
        run: python netvideo_series.py
        
      - name: Generar Peliculas (JSON)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }} 
        run: python netvideo_json.py

      - name: Generar Series (JSON)
        env:
          URL_SERVIDOR: ${{ secrets.URL_SERVIDOR }} 
        run: python netvideo_series_json.py
        
      # --- 2. ENVIAR TODO A DROPBOX ---
      - name: Subir listas a Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python subir_dropbox.py netvideo.pelis.m3u netvideo.series.m3u netvideo_pelis.json netvideo_series.json

      # --- 3. RESPALDO EN REPO CENTRAL (Guia) ---
      - name: Publicar listas en el repo central (Guia sin LFS)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 1. Clonar el repositorio central destino
          git clone https://${{ secrets.API_TOKEN_GITHUB }}@github.com/TIGRE9725/guia.git temp_repo
          
          # 2. Copiar los archivos generados a la carpeta del repo central (SOLO si pesan más de 1KB)
          if [ -f netvideo.pelis.m3u ] && [ $(stat -c%s netvideo.pelis.m3u) -gt 1000 ]; then cp netvideo.pelis.m3u temp_repo/; else echo "Pelis M3U vacío o con error, ignorado."; fi
          if [ -f netvideo.series.m3u ] && [ $(stat -c%s netvideo.series.m3u) -gt 1000 ]; then cp netvideo.series.m3u temp_repo/; else echo "Series M3U vacío o con error, ignorado."; fi
          if [ -f netvideo_pelis.json ] && [ $(stat -c%s netvideo_pelis.json) -gt 1000 ]; then cp netvideo_pelis.json temp_repo/; else echo "Pelis JSON vacío o con error, ignorado."; fi
          if [ -f netvideo_series.json ] && [ $(stat -c%s netvideo_series.json) -gt 1000 ]; then cp netvideo_series.json temp_repo/; else echo "Series JSON vacío o con error, ignorado."; fi
          
          # 3. Entrar, registrar cambios y empujar al repo (SIN LFS)
          cd temp_repo
          git add .
          git diff-index --quiet HEAD || git commit -m "Update: Listas NetVideo enviadas a Respaldo (Validadas)"
          git push origin main
        continue-on-error: true
